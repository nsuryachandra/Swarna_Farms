<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070806" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>SWARNA FARMS — Pure Rice. Pure Life.</title>
    <meta name="description" content="A cinematic scroll journey celebrating heirloom paddy cultivation, pure springs, and pristine harvest from Swarna Farms." />

    <!-- Google Fonts: Cormorant Garamond (Editorial Luxury Serif) & Plus Jakarta Sans (Minimal Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="module" crossorigin src="/assets/index-DcqlXxm6.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D_zBiM7O.css">
  </head>
  <body>
    <!-- 1. Minimalist Editorial Loader -->
    <div id="minimal-loader" class="minimal-loader" aria-live="polite">
      <div class="loader-brand">SWARNA FARMS</div>
      <div class="loader-status-container">
        <div class="loader-bar-track">
          <div class="loader-bar-fill"></div>
        </div>
        <div class="loader-percent">0%</div>
      </div>
    </div>

    <!-- 2. Permanent Subtle Brand Watermark -->
    <header class="cinematic-header" role="banner">
      <div class="brand-monogram">SWARNA FARMS</div>
      <div class="audio-indicator">
        <span class="audio-dot"></span>
        <span>HEIRLOOM HARVEST</span>
      </div>
    </header>

    <!-- 3. Tall Cinematic Scroll Track (User scroll position = animation timeline) -->
    <main id="scroll-track" class="scroll-track-container" role="main">
      <div class="sticky-cinematic-viewport">
        <div class="canvas-frame-container">
          <!-- Hardware-accelerated canvas displaying 9:16 frame-by-frame scrub -->
          <canvas id="frame-canvas" class="frame-canvas"></canvas>

          <!-- Floating editorial text overlay -->
          <div id="editorial-overlay" class="editorial-overlay-layer"></div>

          <!-- Gentle initial scroll prompt -->
          <div id="scroll-prompt" class="scroll-prompt">
            <span class="scroll-prompt-text">Scroll to Explore</span>
            <div class="scroll-prompt-line"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- 4. Ending Luxury Brand Statement (Revealed naturally when final frame completes) -->
    <section id="ending-section" class="ending-section" aria-label="Brand Revelation">
      <div class="ending-content">
        <div class="ending-brand">
          <span class="ending-pre-title">ORIGIN &bull; TRADITION &bull; PURITY</span>
          <h1 class="ending-title">SWARNA FARMS</h1>
          <div class="ending-divider"></div>
          <p class="ending-tagline">PURE RICE. PURE LIFE.</p>
        </div>

        <div class="ending-status-badge">STAY TUNED</div>

        <!-- Discreet release notification form -->
        <form id="notify-form" class="ending-notify-form" novalidate>
          <div class="notify-input-group">
            <input
              type="email"
              id="notify-email"
              class="notify-input"
              placeholder="ENTER EMAIL FOR PRIVATE HARVEST RELEASE"
              required
            />
          </div>
          <button type="submit" class="notify-button">REQUEST INVITATION</button>
          <div id="notify-message" class="notify-message" role="status"></div>
        </form>

        <!-- Replay interactive film -->
        <button id="replay-btn" class="replay-film-btn" type="button" aria-label="Replay Cinematic Film">
          <svg class="replay-icon" viewBox="0 0 24 24">
            <path d="M4 12a8 8 0 0 1 14.93-4M20 12a8 8 0 0 1-14.93 4" stroke-linecap="round" />
            <path d="M20 4v4h-4M4 20v-4h4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          REPLAY FILM
        </button>

        <footer class="ending-footer">
          &copy; 2026 SWARNA FARMS. ALL RIGHTS RESERVED.
        </footer>
      </div>
    </section>

    <!-- Main Module Entrypoint -->
  </body>
</html>
